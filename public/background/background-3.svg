<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Violet glows, dot grid, offset rings. Same recipe as background.svg: keep the line art crisp for the glass to bend, only the color glows are blurred. -->
  <style>
    .base { fill: #d9d9df; }
    .glow-a { fill: #8b5cf6; }
    .glow-b { fill: #c4b5fd; }
    .glow-c { fill: #ffffff; }
    .line { fill: none; stroke: #111111; }
    .dot { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .base { fill: #15151b; }
      .glow-a { fill: #6d28d9; }
      .glow-b { fill: #8b5cf6; }
      .glow-c { fill: #3b1d8f; }
      .line { stroke: #ffffff; }
      .dot { fill: #ffffff; }
    }
  </style>
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="20" cy="20" r="1.6" />
    </pattern>
  </defs>
  <rect class="base" width="1600" height="1000" />
  <g filter="url(#soft)">
    <ellipse class="glow-c" cx="260" cy="180" rx="380" ry="280" />
    <ellipse class="glow-a" cx="1280" cy="240" rx="380" ry="320" />
    <ellipse class="glow-b" cx="700" cy="640" rx="420" ry="240" />
    <ellipse class="glow-c" cx="1420" cy="880" rx="340" ry="240" />
    <ellipse class="glow-a" cx="180" cy="880" rx="360" ry="250" />
  </g>
  <rect width="1600" height="1000" fill="url(#tile)" opacity="0.45" />
  <g class="line" stroke-width="1.5" opacity="0.6">
    <circle cx="300" cy="250" r="140" />
    <circle cx="360" cy="290" r="220" />
    <circle cx="1220" cy="700" r="180" />
    <circle cx="1280" cy="740" r="270" />
    <circle cx="820" cy="460" r="90" />
  </g>
</svg>
