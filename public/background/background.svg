<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Glass only reads as glass when it has sharp detail to bend: keep the grid and rings crisp, only the color glows are blurred. -->
  <style>
    .base { fill: #d9d9df; }
    .glow-a { fill: #2457f5; }
    .glow-b { fill: #6b8cff; }
    .glow-c { fill: #ffffff; }
    .line { fill: none; stroke: #111111; }
    @media (prefers-color-scheme: dark) {
      .base { fill: #15151b; }
      .glow-c { fill: #3a2fb0; }
      .line { stroke: #ffffff; }
    }
  </style>
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="line" d="M40 0H0V40" stroke-width="1" />
    </pattern>
  </defs>
  <rect class="base" width="1600" height="1000" />
  <g filter="url(#soft)">
    <ellipse class="glow-c" cx="260" cy="180" rx="380" ry="280" />
    <ellipse class="glow-a" cx="1280" cy="240" rx="380" ry="320" />
    <ellipse class="glow-b" cx="700" cy="640" rx="420" ry="240" />
    <ellipse class="glow-c" cx="1420" cy="880" rx="340" ry="240" />
    <ellipse class="glow-a" cx="180" cy="880" rx="360" ry="250" />
  </g>
  <rect width="1600" height="1000" fill="url(#grid)" opacity="0.45" />
  <g class="line" stroke-width="1.5" opacity="0.6">
    <circle cx="1240" cy="260" r="170" />
    <circle cx="1240" cy="260" r="250" />
    <circle cx="330" cy="760" r="210" />
    <circle cx="760" cy="420" r="120" />
  </g>
</svg>
